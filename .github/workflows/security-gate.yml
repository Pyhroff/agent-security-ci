name: agent security gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # These five tools are private repos, so they're pulled in with a
      # PAT (TOOLS_PAT) rather than published to PyPI. Same author owns
      # all of them; this simulates how a team would install internal
      # security tooling that isn't public yet.
      - name: Install mcpaudit / loopcheck / memsentry / ragsentry / trainsentry
        env:
          TOOLS_PAT: ${{ secrets.TOOLS_PAT }}
        run: |
          pip install "git+https://x-access-token:${TOOLS_PAT}@github.com/Pyhroff/mcpaudit.git"
          pip install "git+https://x-access-token:${TOOLS_PAT}@github.com/Pyhroff/loopcheck.git"
          pip install "git+https://x-access-token:${TOOLS_PAT}@github.com/Pyhroff/memsentry.git"
          pip install "git+https://x-access-token:${TOOLS_PAT}@github.com/Pyhroff/ragsentry.git"
          pip install "git+https://x-access-token:${TOOLS_PAT}@github.com/Pyhroff/trainsentry.git"

      # --- Clean toy agent: every gate must pass for real. ---
      - name: mcpaudit — clean agent (must pass)
        run: mcpaudit scan --fail-on high -- python toy_agent/clean/mcp_server.py

      - name: loopcheck — clean agent (must pass)
        run: loopcheck analyze toy_agent/clean/trace.json --fail-on medium

      - name: memsentry — clean agent (must pass)
        run: memsentry toy_agent/clean/memory.md --fail-on high

      - name: ragsentry — clean agent (must pass)
        run: ragsentry toy_agent/clean/rag_doc.md --fail-on high

      - name: trainsentry — clean agent (must pass)
        run: trainsentry toy_agent/clean/training_data.jsonl --fail-on high

      # --- Vulnerable toy agent: each scan is EXPECTED to fail. We assert
      # the nonzero exit ourselves, so a red flag here would mean the gate
      # stopped catching a known-bad fixture, not that CI is broken. ---
      - name: mcpaudit — vulnerable agent (must be BLOCKED)
        run: |
          if mcpaudit scan --fail-on high -- python toy_agent/vulnerable/mcp_server.py; then
            echo "::error::mcpaudit did not flag the poisoned tool description — gate regression!"
            exit 1
          fi
          echo "mcpaudit correctly blocked the poisoned tool description."

      - name: loopcheck — vulnerable agent (must be BLOCKED)
        run: |
          if loopcheck analyze toy_agent/vulnerable/trace.json --fail-on medium; then
            echo "::error::loopcheck did not flag the thrashing loop — gate regression!"
            exit 1
          fi
          echo "loopcheck correctly blocked the wasteful trace."

      - name: memsentry — vulnerable agent (must be BLOCKED)
        run: |
          if memsentry toy_agent/vulnerable/memory.md --fail-on high; then
            echo "::error::memsentry did not flag the poisoned memory file — gate regression!"
            exit 1
          fi
          echo "memsentry correctly blocked the poisoned memory file."

      - name: ragsentry — vulnerable agent (must be BLOCKED)
        run: |
          if ragsentry toy_agent/vulnerable/rag_doc.md --fail-on high; then
            echo "::error::ragsentry did not flag the poisoned RAG document — gate regression!"
            exit 1
          fi
          echo "ragsentry correctly blocked the poisoned RAG document."

      - name: trainsentry — vulnerable agent (must be BLOCKED)
        run: |
          if trainsentry toy_agent/vulnerable/training_data.jsonl --fail-on high; then
            echo "::error::trainsentry did not flag the poisoned training example — gate regression!"
            exit 1
          fi
          echo "trainsentry correctly blocked the poisoned training example."

      # --- Adversarial-tooling regression check. adversagen is the
      # red-team counterpart to the five scanners above: it wires
      # RealScannerDefender straight into mcpaudit/memsentry/ragsentry's
      # actual CLIs (see its README). Running its own test suite here
      # means that if a future change to any of those three scanners
      # breaks how adversagen calls them -- a CLI flag rename, an exit
      # code change, an output-format change -- THIS job goes red, not
      # just adversagen's own separate CI. That's a real cross-repo
      # regression this gate is positioned to catch that no single
      # repo's own tests can.
      - name: Clone and test adversagen (adversarial-tooling regression check)
        env:
          TOOLS_PAT: ${{ secrets.TOOLS_PAT }}
        run: |
          set +e
          git clone "https://x-access-token:${TOOLS_PAT}@github.com/Pyhroff/adversagen.git" /tmp/adversagen
          cd /tmp/adversagen
          pip install -r requirements.txt pytest 2>&1 | tee /tmp/pip_out.txt
          python3 -m pytest tests/ -q --tb=short 2>&1 | tee /tmp/pytest_out.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::adversagen test suite failed (exit $status). Tail of output:"
            tail -c 3000 /tmp/pytest_out.txt | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
