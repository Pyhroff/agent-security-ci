name: agent security gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install internal scanners
        env:
          TOOLS_PAT: ${{ secrets.TOOLS_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${TOOLS_PAT:-}" ]; then
            echo "::error::TOOLS_PAT secret is required for private scanner installation"
            exit 1
          fi
          python -m pip install --upgrade pip
          for repo in mcpaudit loopcheck memsentry ragsentry trainsentry specprove-sec weightspecter tokenspecter circuitshield attestinfer; do
            python -m pip install "git+https://x-access-token:${TOOLS_PAT}@github.com/Pyhroff/${repo}.git"
          done

      - name: Verify scanner CLIs
        run: |
          set -euo pipefail
          command -v mcpaudit
          command -v loopcheck
          command -v memsentry
          command -v ragsentry
          command -v trainsentry
          command -v specprove
          command -v weightspecter
          command -v tokenspecter
          command -v circuitshield
          command -v attestinfer

      - name: Run controlled regression benchmark
        run: |
          python scripts/regression.py | tee benchmark/run.log

      - name: Run adversarial challenge corpus
        run: |
          python scripts/challenge.py | tee benchmark/challenge.log

      - name: Publish benchmark summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("benchmark/latest.json")
          if not p.exists():
              raise SystemExit(0)
          r=json.loads(p.read_text())
          m=r["metrics"]; c=r["confusion_matrix"]
          challenge=Path("benchmark/challenge.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Controlled security regression\n\n")
              f.write(f"- Precision: **{m['precision']:.3f}**\n")
              f.write(f"- Recall: **{m['recall']:.3f}**\n")
              f.write(f"- F1: **{m['f1']:.3f}**\n")
              f.write(f"- False-positive rate: **{m['false_positive_rate']:.3f}**\n")
              f.write(f"- Confusion matrix: TP={c['tp']}, FP={c['fp']}, TN={c['tn']}, FN={c['fn']}\n")
              f.write("\n| Scanner | Cases | Precision | Recall | F1 | FPR | Contract |\n|---|---:|---:|---:|---:|---:|---|\n")
              for scanner, s in r.get("by_scanner", {}).items():
                  f.write(f"| {scanner} | {s['cases']} | {s['precision']:.3f} | {s['recall']:.3f} | {s['f1']:.3f} | {s['false_positive_rate']:.3f} | {'PASS' if s['contract_pass'] else 'FAIL'} |\n")
              f.write("\n> Corpus metrics describe only checked-in regression fixtures; they are not production detection claims.\n")
              if challenge.exists():
                  cr=json.loads(challenge.read_text())
                  cm=cr["metrics"]; cc=cr["confusion_matrix"]
                  f.write("\n## Adversarial challenge (non-gating)\n\n")
                  f.write(f"- Precision: **{cm['precision']:.3f}**\n- Recall: **{cm['recall']:.3f}**\n- F1: **{cm['f1']:.3f}**\n- False-positive rate: **{cm['false_positive_rate']:.3f}**\n- Confusion matrix: TP={cc['tp']}, FP={cc['fp']}, TN={cc['tn']}, FN={cc['fn']}\n")
                  f.write("\n> Challenge mismatches are intentionally non-gating and are evidence for follow-up hardening, not release criteria.\n")
          PY

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: security-regression-results
          path: |
            benchmark/latest.json
            benchmark/challenge.json
          if-no-files-found: ignore
          

      - name: Clean fixtures must pass
        run: |
          set -euo pipefail
          mcpaudit scan --fail-on high -- python toy_agent/clean/mcp_server.py
          loopcheck analyze toy_agent/clean/trace.json --fail-on medium
          memsentry toy_agent/clean/memory.md --fail-on high
          ragsentry toy_agent/clean/rag_doc.md --fail-on high
          trainsentry toy_agent/clean/training_data.jsonl --fail-on high
          memsentry toy_agent/clean/goal_hijack_memory.md --fail-on high
          ragsentry toy_agent/clean/fake_remediation_doc.md --fail-on high
          trainsentry toy_agent/clean/goal_hijack_training.jsonl --fail-on high
          specprove scan-py toy_agent/clean/protocol_handlers.py --fail-on-findings
          weightspecter scan toy_agent/clean/lora_adapter.safetensors --fail-on-findings
          tokenspecter scan toy_agent/clean/sse_trace.stream.json --fail-on-findings
          circuitshield scan toy_agent/clean/residual_trace.act.json --fail-on-findings
          attestinfer scan toy_agent/clean/inference_receipt.proof.json --fail-on-findings

      - name: Vulnerable fixtures must be blocked
        shell: bash
        run: |
          set -euo pipefail

          expect_blocked() {
            local label="$1"
            shift
            if "$@"; then
              echo "::error::$label did not block the known-bad fixture"
              exit 1
            fi
            echo "$label correctly blocked the known-bad fixture"
          }

          expect_blocked "mcpaudit" mcpaudit scan --fail-on high -- python toy_agent/vulnerable/mcp_server.py
          expect_blocked "loopcheck" loopcheck analyze toy_agent/vulnerable/trace.json --fail-on medium
          expect_blocked "memsentry" memsentry toy_agent/vulnerable/memory.md --fail-on high
          expect_blocked "ragsentry" ragsentry toy_agent/vulnerable/rag_doc.md --fail-on high
          expect_blocked "trainsentry" trainsentry toy_agent/vulnerable/training_data.jsonl --fail-on high
          expect_blocked "memsentry goal_hijacking" memsentry toy_agent/vulnerable/goal_hijack_memory.md --fail-on high
          expect_blocked "ragsentry fake_remediation" ragsentry toy_agent/vulnerable/fake_remediation_doc.md --fail-on high
          expect_blocked "trainsentry goal_hijacking" trainsentry toy_agent/vulnerable/goal_hijack_training.jsonl --fail-on high
          expect_blocked "specprove formal_protocols" specprove scan-py toy_agent/vulnerable/protocol_handlers.py --fail-on-findings
          expect_blocked "weightspecter lora_weights" weightspecter scan toy_agent/vulnerable/lora_adapter.safetensors --fail-on-findings
          expect_blocked "tokenspecter sse_sidechannel" tokenspecter scan toy_agent/vulnerable/sse_trace.stream.json --fail-on-findings
          expect_blocked "circuitshield refusal_ablation" circuitshield scan toy_agent/vulnerable/residual_trace.act.json --fail-on-findings
          expect_blocked "attestinfer model_downgrade" attestinfer scan toy_agent/vulnerable/inference_receipt.proof.json --fail-on-findings

      - name: Cross-repository adversagen regression
        env:
          TOOLS_PAT: ${{ secrets.TOOLS_PAT }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TOOLS_PAT}@github.com/Pyhroff/adversagen.git" /tmp/adversagen
          cd /tmp/adversagen
          python -m pip install -r requirements.txt pytest
          python -m pytest tests/ -q --tb=short
