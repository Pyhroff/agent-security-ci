name: Safe CI retry

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Failed workflow run ID (must be the latest failed run on the default branch)"
        required: true
        type: string
      job_id:
        description: "One failed job ID from that run"
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate target and rerun only the selected failed job
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          JOB_ID: ${{ inputs.job_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id must be numeric"; exit 1; }
          [[ "$JOB_ID" =~ ^[0-9]+$ ]] || { echo "::error::job_id must be numeric"; exit 1; }

          run="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          job="$(gh api "repos/$REPO/actions/jobs/$JOB_ID")"
          branch="$(gh api "repos/$REPO/branches/$DEFAULT_BRANCH")"

          run_id_from_job="$(jq -r '.run_id' <<<"$job")"
          [[ "$run_id_from_job" == "$RUN_ID" ]] || { echo "::error::Selected job does not belong to selected run"; exit 1; }
          [[ "$(jq -r '.status' <<<"$run")" == "completed" ]] || { echo "::error::Run is not completed"; exit 1; }
          [[ "$(jq -r '.conclusion' <<<"$run")" == "failure" ]] || { echo "::error::Run is not failed"; exit 1; }
          [[ "$(jq -r '.run_attempt' <<<"$run")" == "1" ]] || { echo "::error::Run has already had a retry"; exit 1; }
          [[ "$(jq -r '.head_branch' <<<"$run")" == "$DEFAULT_BRANCH" ]] || { echo "::error::Only default-branch runs may be retried"; exit 1; }
          [[ "$(jq -r '.head_sha' <<<"$run")" == "$(jq -r '.commit.sha' <<<"$branch")" ]] || { echo "::error::Run SHA is stale; default branch has moved"; exit 1; }
          [[ "$(jq -r '.status' <<<"$job")" == "completed" ]] || { echo "::error::Selected job is not completed"; exit 1; }
          [[ "$(jq -r '.conclusion' <<<"$job")" == "failure" ]] || { echo "::error::Selected job did not fail"; exit 1; }

          echo "Validated run $RUN_ID at current default-branch SHA; rerunning failed job $JOB_ID only."
          gh api --method POST "repos/$REPO/actions/jobs/$JOB_ID/rerun" >/dev/null
