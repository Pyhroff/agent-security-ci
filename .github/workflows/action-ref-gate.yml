name: Workflow hardening

on:
  pull_request:

permissions:
  contents: read

jobs:
  immutable-action-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check workflow action refs are immutable
        shell: bash
        run: |
          set -euo pipefail
          violations=0
          while IFS= read -r line; do
            if [[ "$line" =~ uses:[[:space:]]+[^[:space:]@]+@([^[:space:]#]+) ]]; then
              ref="${BASH_REMATCH[1]}"
              if [[ ! "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "::error::Non-immutable action/workflow ref: $line"
                violations=1
              fi
            fi
          done < <(grep -hE '^[[:space:]-]*uses:[[:space:]]+' .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null || true)
          exit "$violations"

  diagnostic-output-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prevent raw CI logs from entering issue comments
        shell: bash
        run: |
          set -euo pipefail
          triage=".github/workflows/ci-failure-triage.yml"
          classification=".github/workflows/ci-failure-classification.yml"
          test -f "$triage"
          test -f "$classification"

          if grep -Eiq '(actions/jobs/.*logs|actions/runs/.*logs|gh run view .*--log)' "$triage"; then
            echo "::error::Triage workflow must not publish raw job logs in issue comments."
            exit 1
          fi
          echo "Triage raw-log guard passed."

          if grep -Fq 'cat > /tmp/classification.md <<EOF' "$classification"; then
            echo "::error::Classification report must not use an unquoted heredoc with Markdown backticks."
            exit 1
          fi
          echo "Classification heredoc guard passed."

          grep -Fq 'printf' "$classification"
          echo "Classification printf check passed."
          grep -Fq 'Raw job logs are used only for local classification and are not included in the issue body.' "$classification"
          echo "Classification issue-body log exclusion check passed."
