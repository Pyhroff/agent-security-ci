name: CI failure triage

on:
  workflow_run:
    workflows:
      - agent security gate
      - Workflow hardening
      - README drift
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Collect failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | [.name,.html_url] | @tsv' \
            > /tmp/failed-jobs.tsv
          if [ ! -s /tmp/failed-jobs.tsv ]; then
            echo "No failed jobs found; workflow may have failed during setup/cancellation."
          fi

      - name: Build diagnostic report
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          {
            printf '## Automated CI failure triage\n\n'
            printf '**Workflow:** %s\n**Run:** %s\n**Commit:** %s\n\n' "$WORKFLOW_NAME" "$RUN_URL" "$SHA"
            printf '### Failed jobs\n'
            while IFS=$'\t' read -r job_name job_url; do
              [ -n "$job_name" ] || continue
              printf '\n- **%s** — %s\n' "$job_name" "$job_url"
            done < /tmp/failed-jobs.tsv
            printf '\n### Triage guidance\n'
            printf '%s\n' '- This issue was generated automatically from a failed GitHub Actions run.' '- Open the linked run to inspect logs using GitHub access controls.' '- Do not paste raw logs or secret-bearing output into this issue.' '- Do not bypass failing security or regression checks.'
          } > /tmp/triage.md

      - name: Open or update triage issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          title="CI failure triage: run $RUN_ID"
          existing="$(gh issue list --repo "$REPO" --state open --search "\"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file /tmp/triage.md
          else
            gh issue create --repo "$REPO" --title "$title" --body-file /tmp/triage.md --label "ci"
          fi
